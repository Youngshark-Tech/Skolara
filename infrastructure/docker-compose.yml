name: skolara

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skolara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skolara_dev}
      POSTGRES_DB: ${POSTGRES_DB:-skolara}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skolara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved for shared (cross-instance) rate limiting — ROADMAP. The API
  # rate-limits in-process today and does not read SKOLARA_REDIS_ADDR; the
  # service is kept so the stack shape matches the target topology.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SKOLARA_ENV: development
      SKOLARA_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-skolara}:${POSTGRES_PASSWORD:-skolara_dev}@postgres:5432/${POSTGRES_DB:-skolara}?sslmode=disable
      SKOLARA_JWT_SECRET: ${SKOLARA_JWT_SECRET:-dev-only-secret-change-me-32-bytes-min}
      # Dev-only HMAC key for the payments webhook — scripts/e2e-smoke.sh signs
      # deliveries with this exact value. Override via .env for anything
      # beyond local development (>= 32 bytes required in production).
      SKOLARA_WEBHOOK_SECRET: ${SKOLARA_WEBHOOK_SECRET:-dev-webhook-secret-0123456789abcdef}
      # Bootstrap platform admin so scripts/e2e-smoke.sh can log in on a fresh
      # volume. Dev-only credentials; override both via .env elsewhere.
      SKOLARA_BOOTSTRAP_ADMIN_EMAIL: ${SKOLARA_BOOTSTRAP_ADMIN_EMAIL:-admin@skolara.test}
      SKOLARA_BOOTSTRAP_ADMIN_PASSWORD: ${SKOLARA_BOOTSTRAP_ADMIN_PASSWORD:-S0pera!Admin2026}
      SKOLARA_CORS_ORIGINS: "http://localhost:3000"
      SKOLARA_LOG_LEVEL: info
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* variables are inlined into the client bundle at BUILD
        # time, so the value must reach the image build, not just runtime env
        # (consumed by apps/web/src/lib/api.ts).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
