name: skolara

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skolara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skolara_dev}
      POSTGRES_DB: ${POSTGRES_DB:-skolara}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skolara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SKOLARA_ENV: development
      SKOLARA_HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-skolara}:${POSTGRES_PASSWORD:-skolara_dev}@postgres:5432/${POSTGRES_DB:-skolara}?sslmode=disable
      SKOLARA_REDIS_ADDR: redis:6379
      SKOLARA_JWT_SECRET: ${SKOLARA_JWT_SECRET:-dev-only-secret-change-me-32-bytes-min}
      SKOLARA_CORS_ORIGINS: "http://localhost:3000"
      SKOLARA_LOG_LEVEL: info
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      SKOLARA_API_URL_INTERNAL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
