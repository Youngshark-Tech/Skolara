  /api/v1/ledger/accounts:
    get:
      tags: [finance]
      summary: Chart of accounts (seeded lazily per school)
      operationId: listLedgerAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: array, items: { $ref: "#/components/schemas/LedgerAccount" } }
    post:
      tags: [finance]
      summary: Register an extra account
      operationId: createLedgerAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
                purpose: { type: string, enum: [main, fees, payroll, transport, meals, activities, reserve, ""] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/journal-entries:
    post:
      tags: [finance]
      summary: Post a balanced journal entry (>= 2 lines; optional idempotencyKey)
      description: |
        Immutable once posted. Corrections reference the original via
        correctionOf (compensating entry). Replaying an idempotencyKey returns
        the original entry with zero new postings.
      operationId: postJournalEntry
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                description: { type: string }
                entryDate: { type: string, format: date }
                idempotencyKey: { type: string }
                correctionOf: { type: string, format: uuid }
                lines:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [accountId]
                    properties:
                      accountId: { type: string, format: uuid }
                      debitMinor: { type: integer, minimum: 0 }
                      creditMinor: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/journal-entries/{id}:
    get:
      tags: [finance]
      summary: Fetch an entry with its lines
      operationId: getJournalEntry
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/fee-structures:
    get:
      tags: [finance]
      summary: List fee structures
      operationId: listFeeStructures
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Fee structures
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeStructures: { type: array, items: { $ref: "#/components/schemas/FeeStructure" } }
    post:
      tags: [finance]
      summary: Create a fee structure
      operationId: createFeeStructure
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, amountMinor]
              properties:
                name: { type: string }
                classGroupId: { type: string, format: uuid, nullable: true }
                academicYearId: { type: string, format: uuid, nullable: true }
                termId: { type: string, format: uuid, nullable: true }
                amountMinor: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeStructure" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/invoices:
    get:
      tags: [finance]
      summary: List invoices (status/learner filters, paginated)
      operationId: listInvoices
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, partially_paid, paid, void] } }
        - { name: learnerId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Invoice page
          headers: { X-Total-Count: { $ref: "#/components/headers/TotalCount" } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [finance]
      summary: Create an invoice (>= 1 positive lines; total derived)
      operationId: createInvoice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerId, dueDate, lines]
              properties:
                learnerId: { type: string, format: uuid }
                feeStructureId: { type: string, format: uuid }
                termId: { type: string, format: uuid }
                dueDate: { type: string, format: date }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [amountMinor]
                    properties:
                      description: { type: string }
                      amountMinor: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created (emits finance.InvoiceCreated.v1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/invoices/{id}:
    get:
      tags: [finance]
      summary: Fetch an invoice with derived totals
      operationId: getInvoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/invoices/{id}/void:
    post:
      tags: [finance]
      summary: Void an unallocated invoice
      operationId: voidInvoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/payments:
    post:
      tags: [finance]
      summary: Record a payment intent (pending; confirmation is webhook-only)
      operationId: createPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, provider, providerRef]
              properties:
                invoiceId: { type: string, format: uuid }
                payerRef: { type: string }
                amountMinor: { type: integer, minimum: 1 }
                provider: { type: string }
                providerRef: { type: string }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/payments/webhooks:
    post:
      tags: [finance]
      summary: Provider webhook (PUBLIC; HMAC-SHA256 signature required)
      description: |
        Signature header: `X-Skolar-Signature: hex(HMAC-SHA256(raw_body, webhook_secret))`.
        Idempotent by eventId: replays return the stored result with zero new
        postings. Confirmation is atomic: CAS pending->confirmed, ledger posting
        (debit wallet_main / credit fees_receivable), invoice allocation,
        PaymentConfirmed + ReceiptIssued events.
      operationId: paymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, eventId, paymentId, status]
              properties:
                schoolId: { type: string, format: uuid }
                eventId: { type: string }
                paymentId: { type: string, format: uuid }
                status: { type: string, enum: [confirmed, failed] }
                providerRef: { type: string }
      responses:
        "200":
          description: Applied (or replayed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  status: { type: string }
                  replayed: { type: boolean }
                  invoiceStatus: { type: string }
        "401": { description: Invalid signature }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/wallet:
    get:
      tags: [finance]
      summary: Institution wallet — derived balances per purpose (ADR-005)
      operationId: getWallet
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: array
                    items: { $ref: "#/components/schemas/WalletBalance" }

components:
  headers:
    TotalCount:
      description: Total number of records matching the query
      schema: { type: integer }
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Missing permission or school context
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found (also used cross-tenant to avoid enumeration)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Domain conflict (state machine, uniqueness, overlap)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled, locked] }
    UserWithPermissions:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            roles: { type: array, items: { type: string } }
            permissions:
              type: object
              additionalProperties: { type: boolean }
    EducationGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    School:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        groupId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Campus:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        location: { type: string }
    Membership:
      type: object
      properties:
        userId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        role: { type: string }
        status: { type: string, enum: [active, suspended] }
    Learner:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date-time, nullable: true }
        gender: { type: string }
        externalId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Guardian:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
    GuardianLink:
      type: object
      properties:
        guardianId: { type: string, format: uuid }
