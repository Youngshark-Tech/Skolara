        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/attendance/sessions:
    get:
      tags: [attendance]
      summary: List attendance sessions (class/date filters, paginated)
      operationId: listAttendanceSessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classGroupId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/AttendanceSession" } }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [attendance]
      summary: Open (or converge on) the session for class+date — retry-safe
      operationId: openAttendanceSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classGroupId, date]
              properties:
                classGroupId: { type: string, format: uuid }
                date: { type: string, format: date }
      responses:
        "200":
          description: The session (pre-existing sessions return 200 with the same id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/attendance/sessions/{id}/records:
    get:
      tags: [attendance]
      summary: List a session's records
      operationId: listAttendanceRecords
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records: { type: array, items: { $ref: "#/components/schemas/AttendanceRecord" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [attendance]
      summary: Bulk-upsert records (idempotent by clientMutationId, 1..500)
      description: |
        Offline-tolerant: replays with the same clientMutationId are no-ops;
        corrections with a new mutation id update the row; the row keeps its
        FIRST mutation id as the replay key. Emits attendance.AbsenceRecorded.v1
        per absent outcome.
      operationId: submitAttendanceRecords
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [learnerId, status, clientMutationId]
                    properties:
                      learnerId: { type: string, format: uuid }
                      status: { type: string, enum: [present, absent, late, excused] }
                      reason: { type: string, maxLength: 200 }
                      clientMutationId: { type: string, maxLength: 128 }
      responses:
        "204": { description: Applied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Session closed }
  /api/v1/attendance/sessions/{id}/close:
    post:
      tags: [attendance]
      summary: Close a session (finalizes the roll call)
      operationId: closeAttendanceSession
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Closed session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/assignments:
