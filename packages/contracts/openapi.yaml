openapi: 3.1.0
info:
  title: Skolara API
  version: 1.0.0
  description: |
    Skolara — The Intelligent Operating System for Schools.

    Conventions:
    - Versioned paths (`/api/v1/…`)
    - Consistent error envelope (`error.code` / `error.message` / `error.details`)
    - `X-Request-ID` propagated to logs and audit
    - `Idempotency-Key` supported on financial mutations (journal entries); payment
      webhooks are idempotent by provider event id
    - Authorization enforced server-side; tenant context derived from the
      verified session (X-School-ID of an ACTIVE membership), never from payloads
    - Amounts are INTEGER minor units (e.g. KES cents) — floats never
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: system
  - name: auth
  - name: users
  - name: tenancy
  - name: students
  - name: academics
  - name: attendance
  - name: assignments
  - name: finance
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200": { description: Service alive }
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (checks dependencies)
      operationId: readyz
      responses:
        "200": { description: Ready }
        "503": { description: Dependencies unavailable }
  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      operationId: metrics
      responses:
        "200": { description: Metrics in Prometheus text format }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email+password (sets rotating refresh cookie)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Access token issued (refresh token in HttpOnly cookie)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, const: Bearer }
                  expiresIn: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token (cookie or body) into a new access token
      operationId: refreshToken
      responses:
        "200": { description: New access + refresh tokens }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the presented refresh token (idempotent)
      operationId: logout
      responses:
        "204": { description: Logged out }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Current user with effective permission set
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithPermissions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users (paginated)
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: User page
          headers: { X-Total-Count: { $ref: "#/components/headers/TotalCount" } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Provision a user (admin flow)
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string }
                name: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Fetch a user
      operationId: getUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/roles:
    post:
      tags: [users]
      summary: Grant a platform role to a user
      operationId: assignRole
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/status:
    patch:
      tags: [users]
      summary: Enable/disable an account (disabling revokes all sessions)
      operationId: setUserStatus
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/education-groups:
    get:
      tags: [tenancy]
      summary: List education groups
      operationId: listEducationGroups
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EducationGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tenancy]
      summary: Create an education group
      operationId: createEducationGroup
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EducationGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/schools:
    get:
      tags: [tenancy]
      summary: List schools (platform admins see all; others see active memberships)
      operationId: listSchools
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: groupId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: object
                properties:
                  schools: { type: array, items: { $ref: "#/components/schemas/School" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tenancy]
      summary: Create a school (tenant root)
      operationId: createSchool
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 32 }
                name: { type: string }
                groupId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/schools/{id}:
    get:
      tags: [tenancy]
      summary: Fetch a school (404 when not a member)
      operationId: getSchool
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: School
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/schools/{id}/campuses:
    get:
      tags: [tenancy]
      summary: List a school's campuses
      operationId: listCampuses
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Campuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  campuses: { type: array, items: { $ref: "#/components/schemas/Campus" } }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tenancy]
      summary: Create a campus
      operationId: createCampus
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                location: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campus" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/schools/{id}/members:
    get:
      tags: [tenancy]
      summary: List a school's members
      operationId: listSchoolMembers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/Membership" } }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tenancy]
      summary: Grant a user a school-scoped role
      operationId: addSchoolMember
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { type: string }
      responses:
        "204": { description: Granted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me/memberships:
    get:
      tags: [tenancy]
      summary: The caller's school memberships
      operationId: myMemberships
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /api/v1/learners:
    get:
      tags: [students]
      summary: List learners enrolled at the acting school (paginated, name search)
      operationId: listLearners
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Learner page
          headers: { X-Total-Count: { $ref: "#/components/headers/TotalCount" } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  learners: { type: array, items: { $ref: "#/components/schemas/Learner" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [students]
      summary: Provision a learner identity (global, not tenant-scoped)
      operationId: createLearner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                middleName: { type: string }
                dateOfBirth: { type: string, format: date-time }
                gender: { type: string }
                externalId: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/learners/{id}:
    get:
      tags: [students]
      summary: Resolve a learner (only via enrollment at the acting school)
      operationId: getLearner
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/guardians:
    post:
      tags: [students]
      summary: Provision a guardian
      operationId: createGuardian
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
                email: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guardian" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/learners/{id}/guardians:
    get:
      tags: [students]
      summary: List a learner's guardian links (with guardian identity)
      operationId: listLearnerGuardians
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Guardian links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuardianLinkView" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [students]
      summary: Link a guardian to a learner
      operationId: linkGuardian
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guardianId, relationship]
              properties:
                guardianId: { type: string, format: uuid }
                relationship: { type: string, enum: [mother, father, guardian, other] }
                isPrimary: { type: boolean }
                canViewFinancials: { type: boolean }
                canViewAcademics: { type: boolean }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianLink" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/enrollments:
    get:
      tags: [students]
      summary: List enrollments at the acting school (paginated)
      operationId: listEnrollments
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EnrollmentStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Enrollment page
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollments: { type: array, items: { $ref: "#/components/schemas/Enrollment" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [students]
      summary: Enroll a learner (applicant or admitted)
      operationId: createEnrollment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerId]
              properties:
                learnerId: { type: string, format: uuid }
                classGroupId: { type: string, format: uuid }
                academicYearId: { type: string, format: uuid }
                status: { type: string, enum: [applicant, admitted] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/enrollments/{id}/transition:
    post:
      tags: [students]
      summary: Move an enrollment through its lifecycle state machine
      operationId: transitionEnrollment
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/EnrollmentStatus" }
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/academic-years:
    get:
      tags: [academics]
      summary: List academic years
      operationId: listAcademicYears
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Years
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicYear" }
    post:
      tags: [academics]
      summary: Create an academic year
      operationId: createAcademicYear
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/academic-years/{id}:
    get:
      tags: [academics]
      summary: Fetch an academic year
      operationId: getAcademicYear
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/academic-years/{id}/terms:
    get:
      tags: [academics]
      summary: List a year's terms
      operationId: listTerms
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/terms:
    post:
      tags: [academics]
      summary: Create a term (must nest in its year; no sibling overlap)
      operationId: createTerm
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicYearId, name, startDate, endDate]
              properties:
                academicYearId: { type: string, format: uuid }
                name: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Term" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/subjects:
    get:
      tags: [academics]
      summary: List subjects
      operationId: listSubjects
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
    post:
      tags: [academics]
      summary: Create a subject (code unique per school)
      operationId: createSubject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 32 }
                name: { type: string, maxLength: 128 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/classes:
    get:
      tags: [academics]
      summary: List class groups (optional yearId filter)
      operationId: listClasses
      security: [{ bearerAuth: [] }]
      parameters: [{ name: yearId, in: query, schema: { type: string } }]
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassGroup" }
    post:
      tags: [academics]
      summary: Create a class group (name unique per school+year)
      operationId: createClass
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicYearId, name]
              properties:
                academicYearId: { type: string, format: uuid }
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/classes/{id}/roster:
    get:
      tags: [academics]
      summary: List a class's roster (learner identities joined)
      operationId: listRoster
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RosterEntryView" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [academics]
      summary: Bulk-seat learners (idempotent, 1..500 ids)
      operationId: addRoster
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerIds]
              properties:
                learnerIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Seated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/classes/{id}/teachers:
    get:
      tags: [academics]
      summary: List a class's teaching assignments
      operationId: listClassTeachers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeachingAssignmentView" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [academics]
      summary: Assign a teacher to class+subject (unique per pair)
      operationId: assignClassTeacher
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, teacherId]
              properties:
                subjectId: { type: string, format: uuid }
