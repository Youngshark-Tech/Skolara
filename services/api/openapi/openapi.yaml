openapi: 3.1.0
info:
  title: Skolara API
  version: 1.0.0
  description: |
    Skolara — The Intelligent Operating System for Schools.

    Conventions:
    - Versioned paths (`/api/v1/…`)
    - Consistent error envelope (`error.code` / `error.message` / `error.details`)
    - `X-Request-ID` propagated to logs and audit
    - `Idempotency-Key` required on financial mutations
    - Authorization enforced server-side; tenant context derived from the
      verified session, never from client payloads.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200": { description: Service alive }
  /readyz:
    get:
      summary: Readiness probe (checks dependencies)
      operationId: readyz
      responses:
        "200": { description: Ready }
        "503": { description: Dependencies unavailable }
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. bad_request, forbidden, rate_limited)
            message:
              type: string
              description: Human-readable explanation
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
    Page:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: string, nullable: true }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
